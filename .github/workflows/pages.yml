# GitHub Pages(보강 11, decisions/0093·0096): 서버 없이 도는 정적 사이트 하나로 묶는다.
#   /            소개 페이지(apps/landing) — [시연 영상 보기] · [시연하기]
#   /video.html  시연 영상(apps/landing/public/media/demo-scenario.mp4 — 시연 묶음에서 실제 앱을 조작해 녹화, scripts/record-demo-video.cjs)
#   /demo/       시연하기 = 시연 홈 녹화 재생본(시연 묶음에서 녹화한 응답 apps/demo-home/public-replay/recording.json을 브라우저가 다시 낸다)
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로.
# 녹화본을 새로 찍는 법: apps/demo-home/scripts/record.cjs 머리말.
name: pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/demo-home/**'
      - 'apps/landing/**'
      - 'packages/contracts/**'
      # 소개 페이지는 기록 수·제목을 빌드 때 docs에서 읽는다
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 시연 홈 녹화 재생본
        working-directory: apps/demo-home
        run: npm ci --no-audit --no-fund && npm test && npm run build:replay
      - name: 소개 페이지
        working-directory: apps/landing
        run: npm ci --no-audit --no-fund && npm test && npm run build
      # 소개 페이지를 뿌리에, 재생본을 demo/에(replay.html을 그 폴더의 index.html로). .nojekyll: Jekyll이 밑줄로 시작하는 파일을 빼지 않게
      - name: 한 사이트로 묶기
        run: |
          mkdir -p site
          cp -r apps/landing/dist/. site/
          cp -r apps/demo-home/dist-replay site/demo
          mv site/demo/replay.html site/demo/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
