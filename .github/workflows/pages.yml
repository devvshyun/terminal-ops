# 시연 홈 녹화 재생본을 GitHub Pages에 올린다(보강 11, decisions/0093).
# 서버 없이 도는 정적 파일 — 시연 묶음에서 녹화한 응답(apps/demo-home/public-replay/recording.json)을 브라우저가 다시 낸다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로.
# 녹화본을 새로 찍는 법: apps/demo-home/scripts/record.cjs 머리말.
name: pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/demo-home/**'
      - 'packages/contracts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:replay
      # replay.html을 첫 화면으로. .nojekyll: Jekyll이 밑줄로 시작하는 파일을 빼지 않게
      - run: mv dist-replay/replay.html dist-replay/index.html && touch dist-replay/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo-home/dist-replay

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
