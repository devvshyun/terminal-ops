# 시연 웹(보강 9, decisions/0086·0088). 호스트 이름마다 화면 하나 — 앱마다 쿠키(sid)가 따로다(이전에는 localhost 포트만 달라 한 쿠키를 함께 썼다, decisions/0074).
# 브라우저는 *.localhost를 이 PC로 푼다(RFC 6761). api·가상 업체·시뮬레이터 이름은 요청 때 Docker DNS로 푼다(resolver) — 그 컨테이너가 늦게 떠도 nginx가 멈추지 않는다.
# 바깥에는 이 8080 하나만, 127.0.0.1에만 연다(docker-compose.demo.yml).
resolver 127.0.0.11 valid=10s ipv6=off;

# 정적 파일은 오래 캐시(이름에 해시), index.html은 매번 새로
map $uri $static_cache {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

# 넘길 때는 받은 그대로의 경로(인코딩 포함)에서 앞마디만 뗀다 — rewrite는 디코딩된 $uri를 써서 %2F 같은 글자가 바뀐다(최종 검토)
map $request_uri $api_rest {
  ~^/api(?<rest>/.*)$ $rest;
  default /;
}
map $request_uri $partners_rest {
  ~^/api/partners(?<rest>/.*)$ $rest;
  default /;
}
map $request_uri $sim_rest {
  ~^/api/sim(?<rest>/.*)$ $rest;
  default /;
}

# 어드민·매장·현장·관제·개발자센터: 같은 모양(정적 파일 + /api → api)이라 한 블록에서 호스트 이름으로 폴더를 고른다
server {
  listen 8080;
  server_name ~^(?<app>admin|merchant|field|console|developers)\.localhost$;
  root /srv/$app;
  # 단말기 엑셀 일괄 등록은 2MB까지 받는다(api) — nginx 기본 1MB에 먼저 막히지 않게(최종 검토)
  client_max_body_size 5m;
  location /api/ {
    proxy_pass http://api:3000$api_rest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    add_header Cache-Control $static_cache;
    try_files $uri $uri/ /index.html;
  }
}

# 시연 도구: 가상 업체 서버·시뮬레이터 관리 API(로그인 없음 — 이 웹 밖으로는 두 서버가 열리지 않는다, decisions/0084·0087)
server {
  listen 8080;
  server_name sandbox.localhost;
  root /srv/sandbox;
  location /api/partners/ {
    proxy_pass http://partners:4010$partners_rest;
  }
  location /api/sim/ {
    proxy_pass http://device-sim:4020$sim_rest;
  }
  location / {
    add_header Cache-Control $static_cache;
    try_files $uri $uri/ /index.html;
  }
}

# 소개 페이지(그 밖의 이름도 여기로)
server {
  listen 8080 default_server;
  server_name localhost;
  root /srv/landing;
  location / {
    add_header Cache-Control $static_cache;
    try_files $uri $uri/ /index.html;
  }
}
